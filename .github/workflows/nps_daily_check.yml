name: NPS Daily Evening Check

on:
  schedule:
    # Runs every day at 14:30 UTC (8:00 PM IST)
    - cron: '30 14 * * *'
  workflow_dispatch: 

permissions:
  contents: write  # Crucial: allows the script to commit and push state updates

jobs:
  run-nps-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install yfinance requests beautifulsoup4 pandas numpy

      - name: Run NPS Decision Engine
        env:
          telegram_token: ${{ secrets.TELEGRAM_TOKEN }}
          chat_id: ${{ secrets.CHAT_ID }}
        run: |
          python nps_script.py
